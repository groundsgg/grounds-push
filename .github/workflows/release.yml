name: Publish Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish when manually dispatched, without a leading v"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    env:
      GRADLE_USER_HOME: /tmp/grounds-push-gradle-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish plugin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$VERSION_INPUT" ]; then
            version_override="$VERSION_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag_name="${GITHUB_REF#refs/tags/}"
            version_override="${tag_name#v}"
          else
            echo "Manual publish requires a version input when the workflow is not run from a v* tag." >&2
            exit 1
          fi

          ./gradlew :plugin:publishAllPublicationsToGitHubPackagesRepository -PversionOverride="$version_override" --no-daemon --stacktrace
